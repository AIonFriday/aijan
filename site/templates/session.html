<!-- One session's page, filled in by the Worker from the sessions table in D1 (sessionPage in src/render.js) and
     served at /sessions/<slug>. Values in {{...}} are HTML-escaped unless the name ends in Html. -->
{{head}}
{{header}}
<main class="wrap"><div class="col">
  <p class="crumb"><a href="/#find">← All sessions</a></p>
  <article class="sp" data-slug="{{slug}}" data-title="{{title}}" data-status="{{status}}" data-count="{{count}}" data-starts-at="{{startsAt}}" data-location="{{location}}" data-length-min="{{lengthMin}}">
    <div class="top">{{tileHtml}}<div class="st">{{statusLineHtml}}</div></div>
    <p class="sp-kind"><span class="kind k-{{kind}}">{{kindName}}</span> {{kindPromise}}</p>
    <h1>{{title}}</h1>
    <p class="desc">{{descriptionHtml}}</p>
    <dl class="facts">
      <dt>When</dt><dd>{{when}}</dd>
      <dt>Where</dt><dd>{{locationHtml}}</dd>
      <dt>Level</dt><dd>{{level}}</dd>
      <dt>Guide</dt><dd>{{guidesHtml}}</dd>
      <dt>Cost</dt><dd>Free</dd>
    </dl>
    <div class="cta">{{buttonsHtml}}<button class="small" type="button" id="share">Share</button></div>
  </article>
  <div class="side">
    {{sideHtml}}
  </div>
</div></main>
{{footer}}
{{sheet}}
<script src="/assets/session.js"></script>
</body>
</html>
