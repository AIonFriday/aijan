<div class="sheet-bg" id="sheet" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh">
    <form class="sheet-step" id="sheet-email-form" novalidate data-email-only>
      <h2 class="as-h3" id="sh">Save your spot</h2>
      <p id="sheet-why">We’ll email the calendar invite and a reminder.</p>
      <label for="sheet-email">Your email</label>
      <input type="email" id="sheet-email" autocomplete="email" inputmode="email" placeholder="you@example.com">
      <span class="err" id="sheet-email-err" hidden>That doesn’t look like an email address.</span>
      <button class="go" type="submit" id="sheet-go">Save my spot</button>
    </form>
    <p class="sheet-or" data-or hidden><span>or</span></p>
    <button class="sso" type="button" data-sso="google" hidden>Continue with Google</button>
    <button class="sso" type="button" data-sso="apple" hidden>Continue with Apple</button>
    <p id="sheet-off" hidden>Saving isn’t switched on yet. Check back soon.</p>
    <p class="sheet-fine">Free. No account, no password. We only email you about what you pick.</p>
    <button class="small" type="button" id="cancel">Not now</button>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<script src="/assets/app.js"></script>
